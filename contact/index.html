<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
</head>

<body>
    <h1>Contact</h1>
    <form action="mailto:example@contact.com" method="post" enctype="text/plain">
        <label>
            Your Email:
            <input name="email" type="email">
        </label>
        <label>
            Email Subject:
            <input name="subject">
        </label>
        <label>
            Email Body:
            <textarea name="body"></textarea>
        </label>
        <button type="submit">Submit</button>
    </form>
</body>

</html>
